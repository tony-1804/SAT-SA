<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=color-scheme content="dark only"><title>SAT-SA</title><style>
:root{--bg:#0b1220;--p:#131c2e;--p2:#1c2841;--b:#2a3956;--t:#e6ecf7;--m:#8fa1c0;--a:#38bdf8;--h:#f87171;--md:#fbbf24;--l:#4ade80}
*{box-sizing:border-box;forced-color-adjust:none}:root{color-scheme:dark only}body{margin:0;font:14px system-ui,Arial;background:var(--bg);color:var(--t)}
#login{max-width:340px;margin:12vh auto;background:var(--p);padding:32px;border-radius:10px;border:1px solid var(--b);text-align:center}
#login h1{margin:0;letter-spacing:3px}input,select{width:100%;padding:10px;margin:8px 0;background:var(--bg);border:1px solid var(--b);color:var(--t);border-radius:6px}
button{background:var(--a);color:#04121f;border:0;padding:9px 16px;border-radius:6px;font-weight:600;cursor:pointer}button.g{background:var(--p2);color:var(--t)}
#app{display:none;min-height:100vh}nav{position:fixed;left:0;top:0;bottom:0;width:210px;background:var(--p);border-right:1px solid var(--b);padding:18px 0}
nav b{display:block;padding:0 20px 4px;font-size:20px;letter-spacing:2px}nav small{display:block;padding:0 20px 18px;color:var(--m)}
nav a{display:block;padding:10px 20px;cursor:pointer;color:var(--m)}nav a.on,nav a:hover{color:#fff;background:var(--p2);border-left:3px solid var(--a)}
main{margin-left:210px;padding:24px 28px}h2{margin:0 0 16px}.row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:16px;flex:1;min-width:170px}.kpi b{font-size:26px;display:block}.kpi span{color:var(--m)}
table{width:100%;border-collapse:collapse}th{color:var(--m);font-weight:500;text-align:left}td,th{padding:8px;border-bottom:1px solid var(--b)}tr.c{cursor:pointer}tr.c:hover{background:var(--p2)}
.HIGH{color:var(--h)}.MEDIUM{color:var(--md)}.LOW{color:var(--l)}.tag{padding:2px 8px;border-radius:10px;background:var(--p2);font-size:12px}.tag.ng{color:#c4b5fd}.tag.eg{color:#7dd3fc}
.f{border-left:4px solid var(--a);background:var(--p2);padding:12px;margin:10px 0;border-radius:4px}.f.ng{border-color:#a78bfa}small,.m{color:var(--m)}.ev{margin-top:8px;overflow:auto}
.pb{display:flex;align-items:center;gap:8px;margin:5px 0}.pb i{display:block;height:8px;border-radius:4px}
@media print{nav,button,.np{display:none!important}main{margin:0}body{background:#fff;color:#000}.card,.f{background:#fff;border-color:#999}td,th{border-color:#ccc}}
</style>
<div id=login><h1>SAT-SA</h1><p class=m>Supervisory Analytics Tool<br>for SOC Assessment</p><input id=u placeholder=Username value=examiner><input id=p type=password placeholder=Password><button onclick=login()>Sign in</button><p id=le class=HIGH></p><small class=m>Offline &middot; NCIIPC examiner portal (prototype)</small></div>
<div id=app><nav><b>SAT-SA</b><small>Examiner console</small><a data-p=dash>Dashboard</a><a data-p=peer>Peer benchmarking</a><a data-p=anom>Anomalies</a><a data-p=trend>Trends</a><a data-p=cases>Case review</a><a data-p=q>Priority queue</a><a data-p=up>Data &amp; analysis</a><a data-p=aud>Audit trail</a><a onclick="location.reload()">Sign out</a></nav><main id=m></main></div>
<script>
let T,D,page='dash';const $=s=>document.querySelector(s),LB={orphan:'Escalated alerts w/o case record',miss_cat:'Absent alert categories',drop:'Activity drop',crit_no_esc:'Hi/Crit closed, not escalated',fast_close:'Hi/Crit closed in minutes',blind:'Critical assets w/o telemetry',dur:'Median case duration (h)',evid:'No evidence attached',reason:'No closure reason',template:'Template notes',repeat:'Repeat rule+asset alerts',stale:'Alerts left open'};
const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{Authorization:'Bearer '+T,...(o.headers||{})}});if(r.status==401){location.reload()}return r};
const col=l=>l=='HIGH'?'#f87171':l=='MEDIUM'?'#fbbf24':'#4ade80',pc=(k,v)=>k=='dur'?v.toFixed(0)+'h':(v*100).toFixed(1)+'%';
async function login(){const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({u:$('#u').value,p:$('#p').value})});if(!r.ok){$('#le').textContent='Invalid credentials';return}T=(await r.json()).token;$('#login').style.display='none';$('#app').style.display='block';await load();go('dash')}
async function load(){D=await (await api('/api/data')).json()}
document.addEventListener('click',e=>{const a=e.target.closest('nav a[data-p]');if(a)go(a.dataset.p)});
function go(p,x){page=p;document.querySelectorAll('nav a[data-p]').forEach(a=>a.classList.toggle('on',a.dataset.p==p));R[p](x)}
const lk=v=>/^CASE-/.test(v)&&D.cases.some(c=>c.case_id==v)?`<a href=# onclick="go('case','${v}');return false" style=color:#38bdf8>${v}</a>`:v;
const tbl=r=>!r.length?'<p class=m>No records.</p>':`<table><tr>${Object.keys(r[0]).map(k=>`<th>${k}</th>`).join('')}</tr>${r.map(x=>`<tr>${Object.values(x).map(v=>`<td>${lk(v)}</td>`).join('')}</tr>`).join('')}</table>`;
const bars=(items,w=420)=>items.map(([n,v,c,mx])=>`<div class=pb><span style="width:110px">${n}</span><i style="width:${Math.max(2,v/mx*w)}px;background:${c}"></i><span>${v.toFixed?v.toFixed(1):v}</span></div>`).join('');
function trend(){const n=Math.max(...D.entities.map(e=>e.weekly.length)),s=Array.from({length:n},(_,i)=>D.entities.reduce((a,e)=>a+(e.weekly[i]||0),0)),mx=Math.max(...s);
return `<svg width=100% viewBox="0 0 460 130"><polyline fill=none stroke=#38bdf8 stroke-width=2 points="${s.map((v,i)=>`${10+i*440/(n-1)},${120-v/mx*105}`).join(' ')}"/><text x=10 y=12 fill=#8fa1c0 font-size=11>peak ${mx} alerts/week</text></svg>`}
const R={
dash(){const k=D.kpi,eg=e=>e.findings.filter(f=>f.type=='Execution Gap').length,ng=e=>e.findings.filter(f=>f.type=='Negative Space').length;
$('#m').innerHTML=`<h2>Supervisory dashboard <button class="g np" style="float:right" onclick=print()>Print report</button></h2><div class=row>${[['Entities assessed',k.entities],['Alerts analysed',k.alerts.toLocaleString()],['Cases analysed',k.cases.toLocaleString()],['High-attention entities',k.high]].map(([a,b])=>`<div class="card kpi"><b>${b}</b><span>${a}</span></div>`).join('')}</div>
<div class=row><div class=card><h3>Entity attention score</h3>${bars(D.entities.map(e=>[e.name,e.score,col(e.level),100]))}</div><div class=card><h3>Weekly alert volume (all entities)</h3>${trend()}</div></div>
<div class=card style="margin-bottom:14px"><h3>Top supervisory findings</h3>${D.entities.filter(e=>e.findings.length).slice(0,4).map(e=>`<div class="f ${e.findings[0].type[0]=='N'?'ng':''}" style="cursor:pointer" onclick="go('ent','${e.id}')"><b>${e.name}</b> <span class=${e.level}>${e.level}</span> &middot; <span class=m>${e.findings[0].capability}</span><br>${e.findings[0].title}<br><small>${e.findings[0].text}</small></div>`).join('')}</div>
<div class=card><h3>Entities <small>&mdash; click to drill down</small></h3><table><tr><th>Entity<th>Sector<th>Alerts<th>Cases<th>Score<th>Attention<th>Execution gaps<th>Negative space</tr>${D.entities.map(e=>`<tr class=c onclick="go('ent','${e.id}')"><td>${e.name}<td>${e.sector}<td>${e.alerts}<td>${e.cases}<td>${e.score}<td class=${e.level}>${e.level}<td>${eg(e)}<td>${ng(e)}</tr>`).join('')}</table><p class=m>Scores are this prototype's transparent, peer-relative methodology &mdash; not an official NCIIPC score. Findings support, not replace, examiner judgement.</p></div>`},
ent(id){const e=D.entities.find(x=>x.id==id);$('#m').innerHTML=`<h2>${e.name} <span class=${e.level}>${e.level}</span> <small>${e.sector} &middot; score ${e.score} &middot; peers: ${e.peer_group}</small> <button class="g np" style="float:right" onclick=print()>Print</button></h2>
<div class=row><div class=card><h3>Entity vs peer median</h3>${Object.keys(LB).map(k=>{const v=e.metrics[k],p=e.peer[k],mx=Math.max(v,p,1e-9);return `<div style="margin:8px 0"><small>${LB[k]}</small><div class=pb><i style="width:${v/mx*260}px;background:${col(e.level)}"></i>${pc(k,v)}</div><div class=pb><i style="width:${p/mx*260}px;background:#64748b"></i><span class=m>peer ${pc(k,p)}</span></div></div>`}).join('')}</div>
<div class=card><h3>Supervisory findings (${e.findings.length})</h3>${e.findings.map((f,i)=>`<div class="f ${f.type[0]=='N'?'ng':''}"><span class="tag ${f.type[0]=='N'?'ng':'eg'}">${f.type}</span> <span class=tag>${f.capability}</span><p><b>${f.title}</b><br>${f.text}</p><small>Why it matters: ${f.why} &middot; deviation z=${f.z}</small><br><button class="g np" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Evidence (${f.evidence.length})</button><div class=ev hidden>${tbl(f.evidence)}</div></div>`).join('')||'<p class=m>No findings above threshold.</p>'}<h3>Weekly alert volume</h3><svg width=100% viewBox="0 0 300 60">${e.weekly.map((v,i)=>`<rect x=${i*22} y=${58-v/Math.max(...e.weekly)*55} width=18 height=${v/Math.max(...e.weekly)*55} fill=#38bdf8 />`).join('')}</svg></div></div>`},
peer(){const ks=Object.keys(LB);$('#m').innerHTML=`<h2>Peer benchmarking</h2><div class="card" style="overflow:auto"><p class=m>Each cell: entity value. Red = at least 1.5 robust deviations worse than the peer median.</p><table><tr><th>Entity${ks.map(k=>`<th>${LB[k]}`).join('')}</tr>${D.entities.map(e=>`<tr><td>${e.name}${ks.map(k=>`<td style="${e.findings.some(f=>f.key==k)?'background:#7f1d1d':''}">${pc(k,e.metrics[k])}`).join('')}</tr>`).join('')}<tr><td><b>Peer median</b>${ks.map(k=>`<td>${pc(k,D.peer[k])}`).join('')}</tr></table></div>`},
anom(){$('#m').innerHTML=`<h2>Anomalies &mdash; unknown indicators</h2><div class=card><p class=m>Unsupervised, label-free: entity-weeks that deviate strongly from that entity's <i>own</i> normal behaviour (robust z-score across alert volume, fast closures, non-escalation, open backlog, closure time). Catches shifts no fixed rule was written for.</p>${tbl(D.anomalies)}</div>`},
trend(id){id=id||D.entities[0].id;const t=D.trend[id],L=(k,c,lab,pct)=>{const v=t[k],mx=Math.max(...v,1e-9);return `<div class=card><h3>${lab}</h3><svg width=100% viewBox="0 0 300 90"><polyline fill=none stroke=${c} stroke-width=2 points="${v.map((x,i)=>`${8+i*284/(v.length-1)},${80-x/mx*70}`).join(' ')}"/><text x=8 y=10 fill=#8fa1c0 font-size=10>max ${pct?(mx*100).toFixed(0)+'%':mx.toFixed(0)}</text></svg><small>${t.weeks[0].slice(0,10)} to ${t.weeks[t.weeks.length-1].slice(-10)}</small></div>`};
$('#m').innerHTML=`<h2>Trend analysis</h2><select onchange="R.trend(this.value)">${D.entities.map(e=>`<option value=${e.id} ${e.id==id?'selected':''}>${e.name}</option>`).join('')}</select><div class=row>${L('alerts','#38bdf8','Alerts per week')}${L('fast','#f87171','High/Crit closed in minutes',1)}${L('noesc','#fbbf24','High/Crit closed, not escalated',1)}</div><div class=row>${L('open','#a78bfa','Alerts left open',1)}${L('hrs','#4ade80','Median closure time (h)')}</div>`},
cases(){$('#m').innerHTML=`<h2>Case review &mdash; prioritised investigations</h2><div class=card><p class=m>Top 300 cases ranked by documentation gaps, duration, repeat patterns, severity and entity context. Click a case for its timeline and record.</p><table><tr><th>Case<th>Entity<th>Severity<th>Status<th>Issues<th>Priority</tr>${D.cases.map(c=>`<tr class=c onclick="go('case','${c.case_id}')"><td>${c.case_id}<td>${c.entity}<td>${c.severity}<td>${c.status}<td>${c.issues.length}<td>${c.priority}</tr>`).join('')}</table></div>`},
case(id){const c=D.cases.find(x=>x.case_id==id);$('#m').innerHTML=`<h2>${c.case_id} <small>${c.entity} &middot; ${c.severity} &middot; ${c.status}</small> <button class="g np" onclick="go('cases')">&larr; Cases</button> <button class="g np" onclick=print()>Print</button></h2><div class=row><div class=card><h3>Timeline</h3>${c.timeline.map(([a,b])=>`<div class=pb><i style="width:10px;height:10px;border-radius:50%;background:${b=='-'?'#475569':'#38bdf8'}"></i><b style=width:170px>${a}</b><span class=m>${b}</span></div>`).join('')}<p class=m>Total duration: ${c.duration_h??'open'} h</p></div><div class=card><h3>Issues detected (why flagged)</h3>${c.issues.map(i=>`<div class=f>&#9888; ${i}<br><small>May indicate weakness in investigation or documentation practice. Examiner judgement required.</small></div>`).join('')||'<p class=m>No issues.</p>'}</div></div><div class=card><h3>Record</h3>${tbl([{rule:c.rule,asset:c.asset,analyst:c.analyst,outcome:c.outcome,notes_words:c.notes_words,priority_score:c.priority}])}</div>`},
q(f=''){const r=D.queue.filter(x=>JSON.stringify(x).toLowerCase().includes(f.toLowerCase()));$('#m').innerHTML=`<h2>Alert samples prioritised for manual review</h2><div class=card><input placeholder="Filter by entity, severity, reason..." oninput="qf(this.value)" value="${f}"><p class=m>Ranked on pattern, closure behaviour, asset criticality and entity context &mdash; not severity alone.</p><div id=qt>${tbl(r)}</div></div>`},
up(){$('#m').innerHTML=`<h2>Data &amp; analysis</h2><div class=card><p>Upload periodic CSV submissions (same columns as the sample data), then run analysis. Processing is local; nothing leaves this machine.</p>${['alerts','cases','assets','entities'].map(n=>`<p>${n}.csv <input type=file accept=.csv,.json id=f_${n}></p>`).join('')}<button onclick=runA()>Upload &amp; run analysis</button> <span id=st class=m></span></div>`},
async aud(){let ev=[];try{const r=await api('/api/events');ev=r.ok?await r.json():[]}catch(e){}$('#m').innerHTML=`<h2>Audit trail</h2><div class=row><div class=card><h3>Analysis run</h3><pre class=m style="white-space:pre-wrap">${JSON.stringify(D.audit,null,1)}</pre></div><div class=card><h3>User actions</h3>${tbl(ev)}</div></div>`}};
const qf=v=>{$('#qt').innerHTML=tbl(D.queue.filter(x=>JSON.stringify(x).toLowerCase().includes(v.toLowerCase())))};
async function runA(){const st=$('#st');for(const n of ['alerts','cases','assets','entities']){const f=$('#f_'+n).files[0];if(f)await api('/api/upload/'+n+(f.name.endsWith('.json')?'?fmt=json':''),{method:'POST',body:await f.text()})}
st.textContent='Analysing...';const r=await api('/api/analyze',{method:'POST'});if(r.ok){await load();st.textContent='Done. See Dashboard.'}else st.textContent='Analysis failed - check CSV columns.'}
</script>
